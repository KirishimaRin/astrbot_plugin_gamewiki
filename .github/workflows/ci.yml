name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly live BWIKI drift check; see the drift job.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -c requirements-constraints.txt -r requirements-dev.txt
      - run: python -m ruff check main.py wiki tests scripts
      - run: python -m ruff format --check main.py wiki tests scripts
      - run: python -m pytest -q
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-python-${{ matrix.python }}
          path: dist/*.zip

  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c requirements-constraints.txt -r requirements-dev.txt docstring-parser
      - name: Download the minimum and reference AstrBot wheels
        run: |
          pip download astrbot==4.5.7 --no-deps -d research/framework-check
          pip download astrbot==4.29.3 --no-deps -d research/framework-check
      - name: Resolve plugin requirements with protected core versions
        run: python scripts/check_dependencies.py
      - run: python scripts/check_framework.py --version 4.5.7
      - run: python scripts/check_framework.py --version 4.29.3

  drift:
    # Live checks against BWIKI catch site redesigns that offline tests cannot.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c requirements-constraints.txt -r requirements-dev.txt
      - run: python scripts/smoke.py
      - run: python scripts/audit_categories.py
      - run: python scripts/smoke_sts2.py
      - run: python scripts/audit_sts2_queries.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: drift-research
          path: |
            research/live-smoke.json
            research/category-audit.json
            research/sts2-smoke.json
            research/sts2-coverage.json
          if-no-files-found: ignore

  release:
    needs: [check, framework]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c requirements-constraints.txt -r requirements-dev.txt
      - name: Tag must match metadata version
        run: |
          python - <<'PY'
          import os, sys, yaml
          version = yaml.safe_load(open("metadata.yaml"))["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != version:
              sys.exit(f"tag {tag} != metadata {version}")
          PY
      - run: python -m pytest -q
      - run: python scripts/package.py
      - name: Attach checksum and extract the CHANGELOG section
        run: |
          cd dist && sha256sum *.zip > checksums.txt && cd ..
          python - <<'PY'
          import os, pathlib, re
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          tag = os.environ["GITHUB_REF_NAME"]
          match = re.search(
              r"^## " + re.escape(tag) + r" — .*?\n(.*?)(?=^## |\Z)",
              changelog, re.M | re.S,
          )
          pathlib.Path("release-notes.md").write_text(
              match.group(1).strip() if match else tag, encoding="utf-8"
          )
          PY
      - name: Create the GitHub Release with the plugin zip
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/checksums.txt --notes-file release-notes.md --title "$GITHUB_REF_NAME" --latest
        env:
          GH_TOKEN: ${{ github.token }}
